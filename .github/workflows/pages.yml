name: Validate Gemellus Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify static site
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/script.js
          grep -q '<title>Gemellus' docs/index.html
          echo "Gemellus static site is ready in /docs."
          echo "Publish it once via Repository Settings > Pages > Deploy from a branch > main > /docs."
